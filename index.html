<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            width: 200px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin: 0 0 10px;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }

        .report {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #eee;
        }
    </style>
</head>

<body>

    <h1>Sales Reports</h1>

    <div class="summary">

        <div class="card">
            <h3>Total Transactions</h3>
            <p id="totalTransactions">0</p>
        </div>

        <div class="card">
            <h3>Total Sales</h3>
            <p id="totalSales">₱0.00</p>
        </div>

        <div class="card">
            <h3>Total Items Sold</h3>
            <p id="totalItems">0</p>
        </div>

    </div>

    <div class="report">

        <h2>Transaction Summary</h2>

        <table>
            <thead>
                <tr>
                    <th>Transaction ID</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Payment Method</th>
                </tr>
            </thead>

            <tbody id="reportTable">
            </tbody>
        </table>

    </div>

    <script>

    const transactions = [
        {
            id: "TRX-001",
            date: "09/29/2026",
            items: 3,
            total: 850,
            payment: "Cash"
        },
        {
            id: "TRX-002",
            date: "09/29/2026",
            items: 2,
            total: 1200,
            payment: "GCash"
        },
        {
            id: "TRX-003",
            date: "09/30/2026",
            items: 5,
            total: 650,
            payment: "Cash"
        }
    ];


    let totalTransactions = transactions.length;


    let totalSales = 0;

    for (let i = 0; i < transactions.length; i++) {
        totalSales += transactions[i].total;
    }


    let totalItems = 0;

    for (let i = 0; i < transactions.length; i++) {
        totalItems += transactions[i].items;
    }


    document.getElementById("totalTransactions").textContent = totalTransactions;

    document.getElementById("totalSales").textContent =
        "₱" + totalSales.toLocaleString("en-PH", {
            minimumFractionDigits: 2
        });

    document.getElementById("totalItems").textContent = totalItems;


    const reportTable = document.getElementById("reportTable");

    for (let i = 0; i < transactions.length; i++) {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${transactions[i].id}</td>
            <td>${transactions[i].date}</td>
            <td>${transactions[i].items}</td>
            <td>₱${transactions[i].total.toLocaleString("en-PH", {
                minimumFractionDigits: 2
            })}</td>
            <td>${transactions[i].payment}</td>
        `;

        reportTable.appendChild(row);
    }

</script>

</body>
</html>
